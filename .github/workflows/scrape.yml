name: Scrape results

on:
  schedule:
    # GitHub treats these as "best effort": in practice the 5-minute schedule runs about once an hour.
    - cron: "*/5 * * * *"
    # Match evenings: extra runs every 10 min, 7pm-midnight Melbourne time (08:00-12:59 UTC in
    # daylight saving; 6pm-11pm in winter), when new results and reports land on Datascore.
    - cron: "3,13,23,33,43,53 8-12 * * *"
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      # Uses the Google Chrome that's preinstalled on the runner, so no browser download.
      - run: python scraper/scrape.py

      # If a section failed, keep a screenshot of what the scraper saw (Actions run page -> Artifacts).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-screenshots
          path: /tmp/scrape-debug/
          if-no-files-found: ignore

      - name: Commit changes (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing new."
          else
            git commit -m "Update results $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
